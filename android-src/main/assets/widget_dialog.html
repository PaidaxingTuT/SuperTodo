<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SuperTodo 桌面悬浮清单</title>
  <style>
    :root {
      --bg-mask: rgba(0, 0, 0, 0.65);
      --card-bg: #FFFFFF;
      --card-stroke: #E2E8F0;
      --text-main: #1E293B;
      --text-sec: #64748B;
      --primary: #2563EB;
      --primary-soft: #EFF6FF;
      --item-bg: #F8FAFC;
      --item-hover: #F1F5F9;
      --btn-bg: #F1F5F9;
      --line: #E2E8F0;
      --success: #16A34A;
      --danger: #DC2626;
      --danger-bg: #FEE2E2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-mask: rgba(0, 0, 0, 0.78);
        --card-bg: #1E232D;
        --card-stroke: #333C4E;
        --text-main: #F1F5F9;
        --text-sec: #94A3B8;
        --primary: #3B82F6;
        --primary-soft: #1E293B;
        --item-bg: #262E3D;
        --item-hover: #2F394B;
        --btn-bg: #2F394B;
        --line: #333C4E;
        --success: #22C55E;
        --danger: #EF4444;
        --danger-bg: #451A1A;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 全屏遮罩层 */
    .dialog-overlay {
      width: 100%;
      height: 100%;
      background: var(--bg-mask);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px 16px;
      opacity: 0;
      animation: maskFadeIn 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transition: opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dialog-overlay.closing {
      opacity: 0 !important;
      pointer-events: none;
    }

    @keyframes maskFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* 居中悬浮卡片：弹性回弹曲线 */
    .floating-card {
      width: 100%;
      max-width: 360px;
      max-height: 84vh;
      background: var(--card-bg);
      border: 1px solid var(--card-stroke);
      border-radius: 26px;
      padding: 18px 16px 16px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.38);
      display: flex;
      flex-direction: column;
      transform: scale(0.88) translateY(20px);
      opacity: 0;
      animation: cardPopIn 0.3s cubic-bezier(0.34, 1.25, 0.64, 1) forwards;
      transition: transform 0.18s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.18s cubic-bezier(0.4, 0, 0.2, 1);
      color: var(--text-main);
    }

    .dialog-overlay.closing .floating-card {
      transform: scale(0.9) translateY(14px);
      opacity: 0;
    }

    @keyframes cardPopIn {
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }

    /* 头部区域 */
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .head-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.2px;
    }
    .card-badge {
      font-size: 11px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      padding: 2px 8px;
      border-radius: 999px;
      transition: all 0.2s ease;
    }
    .btn-close {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: var(--btn-bg);
      color: var(--text-sec);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border: none;
      transition: transform 0.16s cubic-bezier(0.34, 1.5, 0.64, 1), background 0.15s;
    }
    .btn-close:active {
      transform: scale(0.88);
      background: var(--item-hover);
      color: var(--text-main);
    }

    /* 视图滑入过渡 */
    .view-page {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      animation: pageSlideIn 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 滚动列表 */
    .task-list {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 2px;
      max-height: 52vh;
      margin-bottom: 12px;
    }
    .task-list::-webkit-scrollbar {
      width: 4px;
    }
    .task-list::-webkit-scrollbar-thumb {
      background: var(--card-stroke);
      border-radius: 4px;
    }

    /* 待办行样式 */
    .task-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 9px 11px;
      background: var(--item-bg);
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      user-select: none;
      transition: transform 0.18s cubic-bezier(0.34, 1.4, 0.64, 1), background 0.2s, opacity 0.22s;
    }
    .task-row:active {
      transform: scale(0.98);
      background: var(--item-hover);
    }
    .task-row.done {
      opacity: 0.6;
    }
    .task-seq {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-sec);
      min-width: 16px;
      margin-top: 2px;
    }
    
    /* 复选框弹性动画 */
    .task-check {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 1.8px solid var(--text-sec);
      flex-shrink: 0;
      margin-top: 1.5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .task-row.done .task-check {
      background: var(--primary);
      border-color: var(--primary);
      animation: checkPop 0.26s cubic-bezier(0.34, 1.6, 0.64, 1) forwards;
    }

    @keyframes checkPop {
      0% { transform: scale(0.85); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    .task-row.done .task-check::after {
      content: '';
      width: 4px;
      height: 8px;
      border: solid #FFF;
      border-width: 0 1.8px 1.8px 0;
      transform: rotate(45deg);
      margin-bottom: 2px;
    }
    .task-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--text-main);
      word-break: break-all;
      transition: color 0.2s, text-decoration 0.2s;
    }
    .task-row.done .task-title {
      text-decoration: line-through;
      color: var(--text-sec);
    }

    /* 拖拽排序项：彻底禁用 transform transition，确保 100% 跟手 */
    .settings-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      background: var(--item-bg);
      border-radius: 14px;
      font-size: 12.5px;
      font-weight: 600;
      border: 1.5px solid transparent;
      user-select: none;
      touch-action: pan-y;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .settings-row.sortable-ghost {
      opacity: 0.25 !important;
      background: var(--primary-soft) !important;
      border: 1.5px dashed var(--primary) !important;
    }
    .settings-row.sortable-chosen {
      background: var(--item-hover) !important;
      box-shadow: 0 6px 16px rgba(0,0,0,0.12) !important;
    }
    .settings-row.sortable-drag {
      box-shadow: 0 14px 30px rgba(0,0,0,0.26) !important;
      opacity: 0.96 !important;
      transform: none !important;
      transition: none !important;
    }
    .settings-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-main);
    }
    .tool-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--btn-bg);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sec);
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .tool-btn:active {
      transform: scale(0.9);
      background: var(--item-hover);
      color: var(--text-main);
    }
    .tool-btn.danger:active {
      background: var(--danger-bg);
      color: var(--danger);
    }
    .drag-handle {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-sec);
      cursor: grab;
      touch-action: none;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .drag-handle:active {
      cursor: grabbing;
      color: var(--primary);
    }

    /* 底部功能区 */
    .card-footer {
      display: flex;
      flex-direction: column;
      gap: 8px;
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }
    .action-btn-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .action-pill {
      flex: 1;
      padding: 9px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--card-stroke);
      background: var(--item-bg);
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .action-pill:active {
      transform: scale(0.97);
      background: var(--item-hover);
    }
    .action-pill.primary {
      background: var(--primary);
      color: #FFF;
      border-color: var(--primary);
    }
    .action-pill.primary:active {
      opacity: 0.9;
    }

    /* 快捷新建输入行：强制 nowrap + flex-shrink: 0 杜绝文字竖排 */
    .input-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
      animation: inputRowSlide 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes inputRowSlide {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .text-input {
      flex: 1;
      min-width: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--card-stroke);
      background: var(--item-bg);
      color: var(--text-main);
      font-size: 12.5px;
      outline: none;
      transition: border-color 0.2s;
    }
    .text-input:focus {
      border-color: var(--primary);
    }
    .btn-submit {
      flex-shrink: 0;
      white-space: nowrap;
      word-break: keep-all;
      padding: 8px 13px;
      border-radius: 10px;
      background: var(--primary);
      color: #FFF;
      border: none;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      line-height: 1.2;
      transition: transform 0.15s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .btn-submit:active { transform: scale(0.94); }
    .btn-cancel {
      flex-shrink: 0;
      white-space: nowrap;
      word-break: keep-all;
      padding: 8px 11px;
      border-radius: 10px;
      background: var(--btn-bg);
      color: var(--text-sec);
      border: none;
      font-size: 12px;
      cursor: pointer;
      line-height: 1.2;
      transition: transform 0.15s cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    .btn-cancel:active { transform: scale(0.94); }

    .empty-tip {
      text-align: center;
      color: var(--text-sec);
      font-size: 12.5px;
      padding: 24px 10px;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- 全屏暗色模糊遮罩：点击空白处直接退出悬浮窗返回桌面 -->
  <div class="dialog-overlay" id="dialogOverlay" onclick="handleOverlayClick(event)">
    <div class="floating-card" onclick="event.stopPropagation()">

      <!-- 视图 A：展开清单 -->
      <div id="viewList" class="view-page" style="display:none;">
        <div class="card-head">
          <div class="head-left">
            <span class="card-title">待办清单</span>
            <span class="card-badge" id="listBadge">0 / 0</span>
          </div>
          <div style="display:flex; align-items:center; gap:6px;">
            <button class="tool-btn" onclick="switchToMode('settings')" title="自定义排序">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
            <button class="btn-close" onclick="closeSelfWithAnimation()" title="关闭">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
        </div>

        <div class="task-list" id="curatedListEl">
          <!-- 动态渲染待办项 -->
        </div>

        <div class="card-footer">
          <div class="action-btn-group" id="listBtnRow">
            <button class="action-pill" onclick="showInputRow()">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
              <span>输入新待办</span>
            </button>
            <button class="action-pill" onclick="switchToMode('picker')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              <span>挑选已有待办</span>
            </button>
          </div>

          <div class="input-row" id="listInputRow" style="display:none;">
            <input type="text" class="text-input" id="newTodoInput" placeholder="输入待办内容并回车..." onkeydown="if(event.key==='Enter')submitNewTodo()">
            <button class="btn-submit" onclick="submitNewTodo()">添加</button>
            <button class="btn-cancel" onclick="hideInputRow()">取消</button>
          </div>
        </div>
      </div>

      <!-- 视图 B：自定义与长按拖拽排序（点击右上角关闭直接退出返回桌面） -->
      <div id="viewSettings" class="view-page" style="display:none;">
        <div class="card-head">
          <div class="head-left">
            <span class="card-title">自定义待办清单</span>
          </div>
          <button class="btn-close" onclick="closeSelfWithAnimation()" title="关闭">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <p style="font-size:11px; color:var(--text-sec); margin-bottom:8px;">
          拖拽右侧手柄调整顺序（小组件按此顺序推进）：
        </p>

        <div class="task-list" id="settingsSortListEl">
          <!-- 动态渲染排序项 -->
        </div>

        <!-- 底部添加按钮：自适应暗色背景，暗色模式下自然变深，不突兀 -->
        <div class="card-footer">
          <button class="action-pill" style="width:100%; border-color:var(--primary); color:var(--primary);" onclick="switchToMode('picker')">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>从已有待办库中挑选添加</span>
          </button>
        </div>
      </div>

      <!-- 视图 C：从已有待办库中挑选 -->
      <div id="viewPicker" class="view-page" style="display:none;">
        <div class="card-head">
          <div class="head-left">
            <span class="card-title">挑选已有待办</span>
          </div>
          <button class="btn-close" onclick="switchToMode(previousMode)" title="返回">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <p style="font-size:11px; color:var(--text-sec); margin-bottom:8px;">
          勾选需要放入桌面待办清单的事项：
        </p>

        <div class="task-list" id="pickerListEl">
          <!-- 动态渲染已有库 -->
        </div>

        <div class="card-footer">
          <button class="action-pill primary" style="width:100%;" onclick="confirmPickerSelection()">
            <span>确认加入清单</span>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- 内联引入 SortableJS -->

  <script>
    let currentMode = 'list';
    let previousMode = 'list';
    let rootData = { items: [], widget2x2: [] };
    let sortableInstance = null;
    let isExiting = false;

    // 从 Java Bridge 或 LocalStorage 读取数据
    function loadData() {
      let raw = '';
      if (window.Widget2x2Bridge && typeof window.Widget2x2Bridge.getWidgetData === 'function') {
        raw = window.Widget2x2Bridge.getWidgetData();
      } else {
        raw = localStorage.getItem('supertodo_mock_data') || '';
      }
      try {
        if (raw) {
          rootData = JSON.parse(raw);
        }
      } catch (e) {}

      if (!rootData.items) rootData.items = [];
      if (!Array.isArray(rootData.widget2x2)) {
        rootData.widget2x2 = [];
      }

      // 如果 2x2 尚未自定义过，默认取 items 中未完成的前若干项
      if (rootData.widget2x2.length === 0 && rootData.items.length > 0) {
        rootData.items.filter(it => !it.done).slice(0, 10).forEach(it => {
          rootData.widget2x2.push({ id: it.id, title: it.title, done: false });
        });
        saveData();
      }
    }

    function saveData() {
      const json = JSON.stringify(rootData);
      if (window.Widget2x2Bridge && typeof window.Widget2x2Bridge.saveWidgetData === 'function') {
        window.Widget2x2Bridge.saveWidgetData(json);
      } else {
        localStorage.setItem('supertodo_mock_data', json);
      }
    }

    // 丝滑退场动效并立即关闭
    function closeSelfWithAnimation() {
      if (isExiting) return;
      isExiting = true;
      const overlay = document.getElementById('dialogOverlay');
      overlay.classList.add('closing');
      setTimeout(() => {
        if (window.Widget2x2Bridge && typeof window.Widget2x2Bridge.close === 'function') {
          window.Widget2x2Bridge.close();
        }
      }, 180);
    }

    function handleOverlayClick(e) {
      if (e.target === document.getElementById('dialogOverlay')) {
        closeSelfWithAnimation();
      }
    }

    function handleBackPressed() {
      if (currentMode === 'picker') {
        switchToMode(previousMode);
      } else {
        closeSelfWithAnimation();
      }
    }

    function switchToMode(mode) {
      if (currentMode !== mode) {
        previousMode = currentMode;
      }
      currentMode = mode;
      
      const vList = document.getElementById('viewList');
      const vSettings = document.getElementById('viewSettings');
      const vPicker = document.getElementById('viewPicker');

      vList.style.display = (mode === 'list') ? 'flex' : 'none';
      vSettings.style.display = (mode === 'settings') ? 'flex' : 'none';
      vPicker.style.display = (mode === 'picker') ? 'flex' : 'none';

      if (mode === 'list') {
        renderList();
      } else if (mode === 'settings') {
        renderSettings();
      } else if (mode === 'picker') {
        renderPicker();
      }
    }

    // ----------------------------------------------------
    // 视图 A：展开清单渲染与逻辑
    // ----------------------------------------------------
    function renderList() {
      const listEl = document.getElementById('curatedListEl');
      const badgeEl = document.getElementById('listBadge');
      const tasks = rootData.widget2x2 || [];
      const doneCount = tasks.filter(t => t.done).length;
      badgeEl.textContent = doneCount + ' / ' + tasks.length;

      if (tasks.length === 0) {
        listEl.innerHTML = '<div class="empty-tip">当前清单暂无待办事项<br>点击下方按钮添加或挑选</div>';
        return;
      }

      listEl.innerHTML = tasks.map((t, idx) => {
        return '<div class="task-row ' + (t.done ? 'done' : '') + '" onclick="toggleTaskDone(\'' + t.id + '\')">' +
          '<span class="task-seq">' + (idx + 1) + '.</span>' +
          '<div class="task-check"></div>' +
          '<div class="task-title">' + escapeHtml(t.title) + '</div>' +
        '</div>';
      }).join('');
    }

    function toggleTaskDone(id) {
      const task = (rootData.widget2x2 || []).find(t => t.id === id);
      if (task) {
        task.done = !task.done;
        if (rootData.items) {
          const mainItem = rootData.items.find(it => it.id === id);
          if (mainItem) {
            mainItem.done = task.done;
          }
        }
        saveData();
        renderList();
      }
    }

    function showInputRow() {
      document.getElementById('listBtnRow').style.display = 'none';
      document.getElementById('listInputRow').style.display = 'flex';
      setTimeout(() => {
        document.getElementById('newTodoInput').focus();
      }, 60);
    }

    function hideInputRow() {
      document.getElementById('listBtnRow').style.display = 'flex';
      document.getElementById('listInputRow').style.display = 'none';
      document.getElementById('newTodoInput').value = '';
    }

    function submitNewTodo() {
      const input = document.getElementById('newTodoInput');
      const text = (input.value || '').trim();
      if (!text) return;

      const newId = 't_' + Date.now();
      const newTask = {
        id: newId,
        title: text,
        done: false,
        created: Date.now()
      };

      if (!rootData.items) rootData.items = [];
      rootData.items.push(newTask);

      if (!rootData.widget2x2) rootData.widget2x2 = [];
      rootData.widget2x2.push({ id: newId, title: text, done: false });

      saveData();
      hideInputRow();
      renderList();
    }

    // ----------------------------------------------------
    // 视图 B：设置与排序渲染（极致跟手优化）
    // ----------------------------------------------------
    function renderSettings() {
      const listEl = document.getElementById('settingsSortListEl');
      const tasks = rootData.widget2x2 || [];

      if (tasks.length === 0) {
        listEl.innerHTML = '<div class="empty-tip">当前清单暂无待办，请从下方挑选添加</div>';
        if (sortableInstance) {
          sortableInstance.destroy();
          sortableInstance = null;
        }
        return;
      }

      listEl.innerHTML = tasks.map((t, idx) => {
        return '<div class="settings-row" data-id="' + t.id + '">' +
          '<span class="task-seq">' + (idx + 1) + '.</span>' +
          '<span class="settings-title">' + escapeHtml(t.title) + '</span>' +
          '<div class="drag-handle" title="按住拖拽"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="2"></circle><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="15" cy="12" r="2"></circle><circle cx="9" cy="18" r="2"></circle><circle cx="15" cy="18" r="2"></circle></svg></div>' +
          '<button class="tool-btn danger" onclick="removeFromCurated(\'' + t.id + '\')" title="从清单移除"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>' +
        '</div>';
      }).join('');

      initSortable(listEl);
    }

    function initSortable(el) {
      if (sortableInstance) {
        sortableInstance.destroy();
        sortableInstance = null;
      }
      if (typeof Sortable === 'undefined') return;

      // 极致跟手：无延迟，纯净滑动
      sortableInstance = new Sortable(el, {
        animation: 150,
        handle: '.drag-handle',
        ghostClass: 'sortable-ghost',
        chosenClass: 'sortable-chosen',
        dragClass: 'sortable-drag',
        delay: 0,
        touchStartThreshold: 0,
        forceFallback: false,
        onEnd: function(evt) {
          const oldIdx = evt.oldIndex;
          const newIdx = evt.newIndex;
          if (oldIdx === newIdx || oldIdx == null || newIdx == null) return;

          const arr = rootData.widget2x2 || [];
          const [moved] = arr.splice(oldIdx, 1);
          arr.splice(newIdx, 0, moved);

          const seqEls = el.querySelectorAll('.task-seq');
          seqEls.forEach((seq, i) => { seq.textContent = (i + 1) + '.'; });

          saveData();
        }
      });
    }

    function removeFromCurated(id) {
      rootData.widget2x2 = (rootData.widget2x2 || []).filter(t => t.id !== id);
      saveData();
      renderSettings();
    }

    // ----------------------------------------------------
    // 视图 C：挑选已有待办
    // ----------------------------------------------------
    let selectedPickerIds = new Set();

    function renderPicker() {
      const listEl = document.getElementById('pickerListEl');
      const allItems = rootData.items || [];
      const currentIds = new Set((rootData.widget2x2 || []).map(t => t.id));
      selectedPickerIds = new Set(currentIds);

      if (allItems.length === 0) {
        listEl.innerHTML = '<div class="empty-tip">系统内尚无已有待办事项</div>';
        return;
      }

      listEl.innerHTML = allItems.map(it => {
        const checked = selectedPickerIds.has(it.id);
        return '<div class="task-row ' + (checked ? 'done' : '') + '" onclick="togglePickerItem(this, \'' + it.id + '\')">' +
          '<div class="task-check"></div>' +
          '<div class="task-title">' + escapeHtml(it.title) + '</div>' +
        '</div>';
      }).join('');
    }

    function togglePickerItem(rowEl, id) {
      if (selectedPickerIds.has(id)) {
        selectedPickerIds.delete(id);
        rowEl.classList.remove('done');
      } else {
        selectedPickerIds.add(id);
        rowEl.classList.add('done');
      }
    }

    function confirmPickerSelection() {
      const allItems = rootData.items || [];
      const oldMap = new Map((rootData.widget2x2 || []).map(t => [t.id, t]));
      const newCurated = [];

      allItems.forEach(it => {
        if (selectedPickerIds.has(it.id)) {
          if (oldMap.has(it.id)) {
            newCurated.push(oldMap.get(it.id));
          } else {
            newCurated.push({ id: it.id, title: it.title, done: !!it.done });
          }
        }
      });

      rootData.widget2x2 = newCurated;
      saveData();
      switchToMode(previousMode);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    // 初始化入口
    window.addEventListener('DOMContentLoaded', () => {
      loadData();
      const params = new URLSearchParams(window.location.search);
      const mode = params.get('mode') || 'list';
      switchToMode(mode);
    });
  </script>
</body>
</html>
