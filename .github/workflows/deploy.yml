name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 确定版本号（打标签用标签名；手动触发按最新标签递增）
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEW="${{ github.ref_name }}"
          else
            LATEST=$(git tag --sort=-v:refname | head -1)
            NEW=$(python3 -c "import re; latest='$LATEST'.strip(); nums=[int(x) for x in re.findall(r'\d+',latest)] or [0,0]; nums[-1]+=1; print('v'+'.'.join(map(str,nums)))")
          fi
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "构建版本 $NEW"
      - name: Capacitor 封装（注入版本号到 Web 副本）
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          mkdir -p dist
          cp index.html style.css app.js Sortable.min.js manifest.webmanifest icon.svg app-icon.png sw.js dist/
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$NEW'/" dist/app.js
          npx cap init "超级清单" com.dax.supertodo --web-dir dist
          npx cap add android
          npx cap sync android
      - name: 内置下载（原生 DownloadManager，不跳浏览器）
        run: |
          MAIN=$(find android/app/src/main/java -name "MainActivity.java" | head -1)
          cat > "$MAIN" <<'JAVAEOF'
          package com.dax.supertodo;

          import android.app.DownloadManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.DownloadListener;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      if (getBridge() != null && getBridge().getWebView() != null) {
                          getBridge().getWebView().setDownloadListener(new DownloadListener() {
                              @Override
                              public void onDownloadStart(String url, String userAgent, String contentDisposition, String mimeType, long contentLength) {
                                  try {
                                      DownloadManager.Request req = new DownloadManager.Request(Uri.parse(url));
                                      req.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                                      req.setTitle("SuperTodo 更新");
                                      ((DownloadManager) getSystemService(DOWNLOAD_SERVICE)).enqueue(req);
                                  } catch (Exception ignore) {}
                              }
                          });
                      }
                  } catch (Exception ignore) {}
              }
          }
          JAVAEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 应用自定义应用图标
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cd android/app/src/main/res
          for d in mipmap-*/; do
            size=$(basename "$d" | tr -dc '0-9')
            [ -z "$size" ] && size=48
            for f in ic_launcher ic_launcher_round; do
              if [ -f "$d/$f.png" ]; then
                convert -background none ../../../../../icon.svg -resize "${size}x${size}" "$d/$f.png"
              fi
            done
          done
      - name: 设置 Android 版本号
        run: |
          VER="${NEW#v}"
          VCODE=$(python3 - "$VER" <<'PYEOF'
          import sys
          code=0
          for p in [int(x) for x in sys.argv[1].split('.')]:
              code = code*100 + p
          print(code)
          PYEOF
          )
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          echo "versionName=$VER versionCode=$VCODE"
      - name: 固定签名密钥（保证版本间可覆盖安装）
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 生成更新说明（取自 CHANGELOG）
        run: |
          python3 - "$NEW" <<'PYEOF'
          import sys
          new = sys.argv[1]
          txt = open('CHANGELOG.md', encoding='utf-8').read()
          i = txt.find('## ' + new)
          if i < 0:
              print('CHANGELOG 中未找到 ' + new)
              sys.exit(1)
          j = txt.find('\n## ', i + 4)
          seg = txt[i:] if j < 0 else txt[i:j]
          body = '\n'.join(seg.split('\n')[1:]).strip()
          open('notes.md', 'w', encoding='utf-8').write(body + '\n')
          PYEOF
      - name: APK 命名
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "SuperTodo-${NEW#v}.apk"
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEW" "SuperTodo-${NEW#v}.apk" --title "$NEW" --notes-file notes.md
          echo "已发布 Release $NEW"
