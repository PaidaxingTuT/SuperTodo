name: Build & Release APK

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 确定版本号（打标签用标签名；手动触发按最新标签递增）
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            NEW="${{ github.ref_name }}"
          else
            LATEST=$(git tag --sort=-v:refname | head -1)
            NEW=$(python3 -c "import re; latest='$LATEST'.strip(); nums=[int(x) for x in re.findall(r'\d+',latest)] or [0,0]; nums[-1]+=1; print('v'+'.'.join(map(str,nums)))")
          fi
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "构建版本 $NEW"
      - name: Capacitor 封装（注入版本号到 Web 副本）
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/app
          mkdir -p dist
          cp index.html style.css app.js Sortable.min.js icon.svg app-icon.png app-icon-dark.png app-icon-foreground.png dist/
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$NEW'/" dist/app.js
          npx cap init "超级清单" com.dax.supertodo --web-dir dist
          npx cap add android
          npx cap sync android
      - name: 注入澎湃OS桌面小组件源码与配置
        run: |
          cp -r android-src/main/* android/app/src/main/
          python3 scripts/inject_android_widget.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 应用自定义应用图标与启动页
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          cd android/app/src/main/res
          for spec in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            density=${spec%%:*}; rest=${spec#*:}; size=${rest%%:*}; foreground=${rest##*:}
            day="mipmap-$density"; night="mipmap-night-$density"
            mkdir -p "$day" "$night"
            convert -background none ../../../../../app-icon.png -resize "${size}x${size}" "$day/ic_launcher.png"
            convert -background none ../../../../../app-icon.png -resize "${size}x${size}" "$day/ic_launcher_round.png"
            convert -background none ../../../../../app-icon.png -resize "${foreground}x${foreground}" "$day/ic_launcher_foreground.png"
            convert -background none ../../../../../app-icon-dark.png -resize "${size}x${size}" "$night/ic_launcher.png"
            convert -background none ../../../../../app-icon-dark.png -resize "${size}x${size}" "$night/ic_launcher_round.png"
            convert -background none ../../../../../app-icon-foreground.png -resize "${foreground}x${foreground}" "$night/ic_launcher_foreground.png"
          done
          mkdir -p values values-night
          printf '%s\n' '<resources><color name="ic_launcher_background">#FFFFFF</color><color name="splash_background">#FFFFFF</color></resources>' > values/ic_launcher_background.xml
          printf '%s\n' '<resources><color name="ic_launcher_background">#16191F</color><color name="splash_background">#16191F</color></resources>' > values-night/ic_launcher_background.xml
          for spec in mdpi:288:108 hdpi:432:160 xhdpi:576:216 xxhdpi:864:324 xxxhdpi:1152:432; do
            density=${spec%%:*}; rest=${spec#*:}; canvas=${rest%%:*}; iconsize=${rest##*:}
            mkdir -p "drawable-$density" "drawable-night-$density"
            convert -background none ../../../../../app-icon.png -resize "${canvas}x${canvas}" "drawable-$density/splash_icon.png"
            convert -background none ../../../../../app-icon-foreground.png -trim +repage -resize "${iconsize}x${iconsize}" -gravity center -extent "${canvas}x${canvas}" "drawable-night-$density/splash_icon.png"
          done
          mkdir -p drawable drawable-night
          convert -background none ../../../../../app-icon.png -resize "432x432" "drawable/splash_icon.png"
          convert -background none ../../../../../app-icon-foreground.png -trim +repage -resize "160x160" -gravity center -extent "432x432" "drawable-night/splash_icon.png"
          python3 - <<'PYEOF'
          import re
          path = 'values/styles.xml'
          txt = open(path, 'r', encoding='utf-8').read()
          new_theme = '''<style name="AppTheme.NoActionBarLaunch" parent="Theme.SplashScreen">
              <item name="android:background">@drawable/splash</item>
              <item name="windowSplashScreenBackground">@color/splash_background</item>
              <item name="windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              <item name="android:windowSplashScreenBackground">@color/splash_background</item>
              <item name="android:windowSplashScreenAnimatedIcon">@drawable/splash_icon</item>
              <item name="postSplashScreenTheme">@style/AppTheme.NoActionBar</item>
          </style>'''
          txt = re.sub(r'<style name="AppTheme\.NoActionBarLaunch"[^>]*>.*?</style>', new_theme, txt, flags=re.DOTALL)
          open(path, 'w', encoding='utf-8').write(txt)
          PYEOF
          for src in drawable/splash.png drawable-land-*/splash.png drawable-port-*/splash.png; do
            [ -f "$src" ] || continue
            dir=${src%/*}
            case "$dir" in
              drawable) night="drawable-night" ;;
              drawable-land-*) night="${dir/drawable-land-/drawable-land-night-}" ;;
              drawable-port-*) night="${dir/drawable-port-/drawable-port-night-}" ;;
            esac
            mkdir -p "$night"
            convert "$src" -fuzz 15% -fill '#16191F' -opaque white "$night/splash.png"
          done
      - name: 设置 Android 版本号
        run: |
          VER="${NEW#v}"
          VCODE=$(python3 - "$VER" <<'PYEOF'
          import sys
          code=0
          for p in [int(x) for x in sys.argv[1].split('.')]:
              code = code*100 + p
          print(code)
          PYEOF
          )
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $VCODE/" android/app/build.gradle
          echo "versionName=$VER versionCode=$VCODE"
      - name: 固定签名密钥（显式写入 build.gradle，指向仓库内 debug.keystore）
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'GRADLEEOF'

          android {
              signingConfigs {
                  debug {
                      storeFile file('../../debug.keystore')
                      storePassword 'android'
                      keyAlias 'androiddebugkey'
                      keyPassword 'android'
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          }
          GRADLEEOF
          echo "已将 debug 签名显式指向仓库内 debug.keystore"
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 校验 APK 签名 = 仓库固定钥匙（不一致则构建失败，防止再发布错误签名包）
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "$APKSIGNER" ]; then echo "找不到 apksigner"; exit 1; fi
          keytool -exportcert -keystore debug.keystore -storepass android -alias androiddebugkey -file /tmp/fixed.der
          KEY_SHA=$(sha256sum /tmp/fixed.der | cut -d' ' -f1)
          APK_SHA=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | awk -F': ' 'tolower($0) ~ /sha-256 digest/ {print $NF; exit}' \
            | tr -d ':\r\n ' | tr 'A-F' 'a-f')
          echo "APK 证书: $APK_SHA"
          echo "固定钥匙: $KEY_SHA"
          if [ -n "$APK_SHA" ] && [ "$APK_SHA" = "$KEY_SHA" ]; then
            echo "签名校验通过：APK 由固定 debug.keystore 签名"
          else
            echo "签名校验失败：APK 未使用固定 debug.keystore 签名！"
            exit 1
          fi
      - name: 生成更新说明（取自 CHANGELOG）
        run: |
          python3 - "$NEW" <<'PYEOF'
          import sys
          new = sys.argv[1]
          txt = open('CHANGELOG.md', encoding='utf-8').read()
          i = txt.find('## ' + new)
          if i < 0:
              print('CHANGELOG 中未找到 ' + new)
              sys.exit(1)
          j = txt.find('\n## ', i + 4)
          seg = txt[i:] if j < 0 else txt[i:j]
          body = '\n'.join(seg.split('\n')[1:]).strip()
          open('notes.md', 'w', encoding='utf-8').write(body + '\n')
          PYEOF
      - name: APK 命名
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "SuperTodo-${NEW#v}.apk"
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEW" "SuperTodo-${NEW#v}.apk" --title "$NEW" --notes-file notes.md
          echo "已发布 Release $NEW"
