name: Build & Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 计算新版本号（最新 tag 末段 +1）
        id: ver
        run: |
          LATEST=$(git tag --sort=-v:refname | head -1)
          NEW=$(python3 -c "import re; latest='$LATEST'.strip(); nums=[int(x) for x in re.findall(r'\d+',latest)] or [0,0]; nums[-1]+=1; print('v'+'.'.join(map(str,nums)))")
          echo "NEW=$NEW" >> "$GITHUB_ENV"
          echo "latest=$LATEST -> new=$NEW"
      - name: Capacitor 封装（注入版本号到 Web 副本）
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
          mkdir -p dist
          cp index.html style.css app.js manifest.webmanifest icon.svg sw.js dist/
          sed -i "s/const APP_VERSION='[^']*'/const APP_VERSION='$NEW'/" dist/app.js
          npx cap init "清单" com.paidaxing.todo --web-dir dist
          npx cap add android
          npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: 构建 APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEW" android/app/build/outputs/apk/debug/app-debug.apk --title "$NEW" --generate-notes
          echo "已发布 Release $NEW"
